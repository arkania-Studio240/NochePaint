name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir proyecto
        run: unzip -q DarkPaint_RAIZ.zip -d proyecto

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Pruebas unitarias y APK de depuración
        working-directory: proyecto
        run: gradle testDebugUnitTest assembleDebug --stacktrace

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: DarkPaint-debug-apk
          path: proyecto/app/build/outputs/apk/debug/*.apk

      - name: Subir informes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-de-pruebas
          path: proyecto/app/build/reports/
